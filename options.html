<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTL Extension Settings</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e2e5e9;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 16px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 20px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: none; }
    .row-text { padding-right: 16px; }
    .row-title { font-size: 15px; font-weight: 600; }
    .row-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #cbd0d6; transition: .2s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 3px; bottom: 3px; background: #fff; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }
    input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

    .status {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Right-to-Left Settings</h1>
    <p class="subtitle">Choose where RTL text direction is applied.</p>

    <div class="card">
      <div class="row">
        <div class="row-text">
          <div class="row-title">Outlook Web</div>
          <div class="row-desc">Right-to-Left direction and right-side cursor in the email composer.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="outlookEnabled" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div class="row-text">
          <div class="row-title">Gemini Enterprise</div>
          <div class="row-desc">Right-to-Left direction for conversations in Vertex AI Search (vertexaisearch.cloud.google).</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="geminiEnabled" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="status" id="status"></div>
    <div class="footer" id="version"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
